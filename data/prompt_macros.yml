- id: create-a-verifier
  title: "Create a Verifier"
  type: "prompt_macro"
  status: "seed"
  section: "Evaluation, Guardrails, and Reliability"
  aliases:
    - "make a critic"
    - "verification agent"
    - "quality gate"
  intent:
    - "create a second pass that checks work for bugs, missing requirements, and contradictions"
  user_says:
    - "Check this work critically"
    - "Find what is wrong before I ship"
  tags:
    - evals
    - verification
    - agents
    - reliability
  prompt_template: |
    Create a verifier for this output.

    The verifier should check:
    1. Missing requirements
    2. Contradictions
    3. Incorrect assumptions
    4. Security risks
    5. Edge cases
    6. Test coverage gaps
    7. Production readiness

    Return issues ranked by severity and propose fixes.
  related_entries:
    - adversarial-review
    - critic-agent
    - eval

- id: identify-integration-risks-before-implementation
  title: "Identify Integration Risks Before Implementation"
  type: "prompt_macro"
  status: "seed"
  section: "Frontend-Backend Contract Engineering"
  aliases:
    - "preflight integration review"
    - "integration risk scan"
  intent:
    - "find likely frontend/backend bugs before code is written"
  user_says:
    - "What will break when I connect frontend and backend?"
    - "Find integration risks in this plan"
  tags:
    - integration
    - frontend
    - backend
    - qa
  prompt_template: |
    Review this frontend/backend plan and identify likely integration bugs.

    Look for:
    1. Naming mismatches
    2. Missing fields
    3. Unclear state transitions
    4. Race conditions
    5. Auth and permission gaps
    6. Pagination, filtering, and sorting issues
    7. Error handling gaps
    8. Date, money, enum, and ID format inconsistencies
  related_entries:
    - field-to-backend-mapping
    - frontend-backend-handoff-packet

