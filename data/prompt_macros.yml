- id: backend-ready-frontend-spec
  title: "Generate a Backend-Ready Frontend Spec"
  type: "prompt_macro"
  status: "draft"
  section: "Frontend-Backend Contract Engineering"
  aliases:
    - "backend ready spec"
    - "frontend backend handoff"
    - "implementation-ready UI spec"
    - "turn app idea into backend requirements"
  intent:
    - "turn rough product idea into implementation spec"
    - "prepare frontend and backend to build in parallel"
    - "define API contracts from UI requirements"
  user_says:
    - "I need a prompt to build the backend from the frontend"
    - "I want frontend and backend to match"
    - "Help me spec an app idea"
    - "Make this UI ready for backend implementation"
  tags:
    - frontend
    - backend
    - api-contracts
    - database
    - product-spec
  prompt_template: |
    Create a backend-ready frontend spec for the following feature:

    Feature:
    {{feature}}

    Include:
    1. Mock screenshots or wireframes
    2. User flow
    3. Every visible field
    4. Field-to-backend mapping
    5. API endpoints required
    6. Request and response payloads
    7. Database tables and columns
    8. Validation rules
    9. Empty states
    10. Loading states
    11. Error states
    12. Permission rules
    13. Analytics events
    14. Test cases
    15. Mock data fixtures
  related_entries:
    - field-to-backend-mapping
    - frontend-backend-handoff-packet
    - mock-data-must-match-final-api

- id: extract-conversation-into-durable-knowledge-objects
  title: "Extract Conversation Into Durable Knowledge Objects"
  type: "prompt_macro"
  status: "draft"
  section: "Conversation Capture & Knowledge Distillation"
  aliases:
    - "extract don't summarize"
    - "session capture"
    - "conversation to wiki"
    - "no-loss distillation"
  intent:
    - "turn an AI conversation into reusable project knowledge"
    - "preserve decisions, templates, artifacts, and follow-ups"
    - "avoid losing useful context from a long conversation"
  user_says:
    - "Summarize this conversation without losing anything"
    - "Turn this chat into wiki entries"
    - "Extract the useful stuff from this session"
  tags:
    - conversation-capture
    - knowledge-management
    - wiki
    - documentation
  prompt_template: |
    Extract this conversation into durable knowledge objects.

    Create:
    - canonical terms
    - prompt macros
    - decisions
    - templates
    - artifacts
    - open questions
    - source notes
    - follow-up wiki entries

    Preserve important information before compressing. Do not flatten the conversation into a vague summary.
  related_entries:
    - session-to-wiki-compiler
    - durable-knowledge-object
    - no-loss-distillation

- id: turn-ui-into-backend-requirements
  title: "Turn This UI Into Backend Requirements"
  type: "prompt_macro"
  status: "seed"
  section: "Frontend-Backend Contract Engineering"
  aliases:
    - "infer backend from UI"
    - "UI to API requirements"
    - "screen to backend spec"
  intent:
    - "derive APIs, database tables, and permissions from a screen or wireframe"
  user_says:
    - "Here is a screen, what backend do I need?"
    - "Turn this mockup into API requirements"
  tags:
    - frontend
    - backend
    - api
    - database
  prompt_template: |
    Given this screen or wireframe, infer all backend requirements.

    Include:
    1. APIs required
    2. Request and response payloads
    3. Database tables and relationships
    4. Auth and permission rules
    5. Validation rules
    6. Background jobs or side effects
    7. Analytics events
    8. Test cases
    9. Integration risks
  related_entries:
    - field-to-backend-mapping
    - backend-ready-frontend-spec

